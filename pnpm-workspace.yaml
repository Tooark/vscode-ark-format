# Arquivo de configuração do pnpm para monorepo
packages:
  - "packages/*"

# Dependências com script de build (postinstall) autorizadas a executá-lo
allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true

# Correções de versões de dependências para evitar problemas de compatibilidade
overrides:
  qs: ">=6.15.2"
  tmp: ">=0.2.7"
  undici: ">=8.9.0"
  markdown-it: ">=14.2.0"
  vite: ">=8.0.16"
  form-data: ">=4.0.6"
  brace-expansion: ">=5.0.7"
  linkify-it: ">=5.0.2"
  fast-uri: ">=4.1.2"
  js-yaml: ">=4.3.1 <5.0.0"
  postcss: ">=8.5.18"
