# Arquivo de configuração do pnpm para monorepo
packages:
  - "packages/*"

# Dependências com script de build (postinstall) autorizadas a executá-lo
allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true

# Correções de versões de dependências para evitar problemas de compatibilidade
overrides:
  qs: ">=6.15.2"
  vite: ">=8.1.6"
  brace-expansion: ">=5.0.12"
  postcss: ">=8.5.18"
  source-map-js: ">=1.2.2"
