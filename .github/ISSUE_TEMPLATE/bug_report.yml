name: 🐛 Bug report
description: Report a defect in an Ark Format extension.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.
        For **security vulnerabilities**, do NOT file a public issue — see [`SECURITY.md`](https://github.com/Tooark/vscode-ark-format/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am using the latest version of the extension.
          required: true
        - label: This is not a security vulnerability (those go through the private channel).
          required: true

  - type: dropdown
    id: extension
    attributes:
      label: Which extension?
      options:
        - Shell (ark-format-shell)
        - PowerShell (ark-format-powershell)
        - Makefile (ark-format-makefile)
        - Extension Pack (ark-format-pack)
        - Not sure
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "e.g., 1.2.2"
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: "Help → About (or Code → About)."
      placeholder: "e.g., 1.99.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other (WSL, Codespaces, remote…)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Minimal input sample
      description: The smallest snippet that reproduces the wrong formatting (before → after).
      render: shell

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file of type '...'
        2. Run "Format Document"
        3. See the wrong output
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste excerpts from the VS Code Output panel / Developer Tools console. Redact sensitive data.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
